# ============================================================================
# File Name:   ci.yml
# Author:      Eva Tate and Giselle Wu, assisted by Claude Code
# Course:      CS60: Computer Networks
# Assignment:  Final Project: Userspace Stateful Firewall (Tunwall)
# Date:        November 15, 2026
#
# Description: GitHub Actions: build and run the unit tests (plain and under
#              ASan + UBSan) with gcc and clang, then the end-to-end tests in
#              network namespaces, on every push and pull request.
# ============================================================================

name: CI

on:
  push:
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  unit:
    name: unit tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }} all
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test
      - name: Unit tests (ASan + UBSan)
        run: make CC=${{ matrix.cc }} asan

  # End-to-end tests in network namespaces against the real build/tunwall.
  # REQUIRE_INTEGRATION=1 makes a missing piece (binary, script, nmap) a
  # failure, never a skip, so a green check means the tests really ran.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nmap ethtool hping3
      - name: Environment
        run: |
          uname -r; python3 --version; ip -V; curl --version | head -1
          command -v ethtool ss nstat openssl nmap
      - name: Build
        run: make tunwall
      - name: Integration tests
        run: sudo LOGDIR=$PWD/build/integration REQUIRE_INTEGRATION=1 tests/integration/run_all.sh
      - name: Make logs readable for upload
        if: always()
        run: sudo chmod -R a+rX build/integration || true
      - name: Upload firewall log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: build/integration/
