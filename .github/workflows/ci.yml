name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }} all
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test
      - name: Unit tests (ASan + UBSan)
        run: make CC=${{ matrix.cc }} asan

  # Integration tests are NOT run in CI yet: they need build/tunwall and
  # scripts/netns.sh (tun I/O and namespace setup), which don't exist yet. Once
  # they do, uncomment the job below. It deliberately fails (never skips) if a
  # piece is missing, so a green check means the tests really ran.
