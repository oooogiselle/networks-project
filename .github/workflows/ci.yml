name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }} all
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test
      - name: Unit tests (ASan + UBSan)
        run: make CC=${{ matrix.cc }} asan

  # Network-namespace tests. They skip (and pass) until build/tunwall and
  # scripts/netns.sh exist, then run for real.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nmap netcat-openbsd iperf3
      - name: Build
        run: make all && (make tunwall || true)
      - name: Integration tests
        run: sudo tests/integration/run_all.sh
