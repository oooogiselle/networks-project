# Example firewall policy. First match wins; anything unmatched is DENIED.
# See include/rules.h for the full syntax.

# Inside clients may browse the web...
allow tcp  from 10.0.0.0/24 to any port 80
allow tcp  from 10.0.0.0/24 to any port 443

# ...and resolve names, but only through the resolver we trust.
allow udp  from 10.0.0.0/24 to 8.8.8.8 port 53
deny  udp  from any to any port 53

# Inside hosts may ping out (replies are allowed back by the flow table).
allow icmp from 10.0.0.0/24 to any

# Expose one service on client B to the outside (note the 'out' keyword).
# allow out tcp from any to 10.0.0.3 port 8000
