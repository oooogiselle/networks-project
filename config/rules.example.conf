# Example firewall policy for the test topology (inside 10.0.1.0/24,
# outside 10.0.2.0/24). First match wins; anything unmatched is DENIED.
# Compact form:  action [dir] proto src dst [ports|echo]
# (the longer `from <addr> [port N] to <addr> [port N]` form also works;
# see include/rules.h).
#   out = connection initiated from the inside (the default)
#   in  = connection initiated from the outside

# The trusted network. Enables anti-spoofing: packets from outside may not
# claim an inside address, and packets from inside must have one.
inside 10.0.1.0/24

# Inside clients may browse the web
allow out tcp  10.0.1.0/24 any 80,443

# and resolve names, but only through the resolver we trust.
allow out udp  10.0.1.0/24 10.0.2.2 53
deny  out udp  any any 53

# Inside hosts may ping out (replies are allowed back by the flow table).
allow out icmp 10.0.1.0/24 any echo

# Expose SSH on client B to the outside.
allow in  tcp  any 10.0.1.3 22

# Anything not matched above is denied.
